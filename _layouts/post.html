---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
      {% assign words = content | number_of_words %}
      · {{ words | divided_by: 220 | plus: 1 }} min read
    </p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <p class="back"><a href="{{ '/' | relative_url }}#writing">← All writing</a></p>
</article>
